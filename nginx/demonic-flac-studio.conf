# Demonic FLAC Studio — example Nginx reverse-proxy configuration
#
# Copy to /etc/nginx/sites-available/demonic-flac-studio.conf, replace
# YOUR_DOMAIN with your real (sub)domain, then:
#
#   sudo ln -s /etc/nginx/sites-available/demonic-flac-studio.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Run `sudo certbot --nginx -d YOUR_DOMAIN` afterwards to obtain a
# Let's Encrypt certificate and have Certbot rewrite this file with the
# `listen 443 ssl;` block + certificate paths automatically (see README).

# Plain HTTP: Certbot will add a redirect to HTTPS here automatically.
# Until you've run certbot, this serves the app over HTTP so you can verify
# the reverse proxy works before enabling TLS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # FLAC albums can be large; allow generous uploads (adjust to taste).
    client_max_body_size 4G;
    client_body_timeout 300s;

    # Large uploads / album ZIP downloads can take a while on slow links.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No WebSocket usage in this app today; the Upgrade/Connection
        # headers below are harmless to leave in if you add any later.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_buffering off;
    }

    # Optional: quiet the access log for a lightweight health check path.
    location = /api/health {
        proxy_pass http://127.0.0.1:3008;
        access_log off;
    }
}
